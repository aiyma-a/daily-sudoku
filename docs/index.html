<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a56c4">
<title>Daily Sudoku</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body data-theme="classic">
<main>
  <header id="top">
    <h1>Daily Sudoku</h1>
    <div id="mode" role="group" aria-label="Mode">
      <button data-mode="daily">Daily</button>
      <button data-mode="practice">Practice</button>
    </div>
  </header>
  <div id="levelrow">
  <nav id="levels" aria-label="Difficulty">
    <button data-level="easy">Easy</button>
    <button data-level="medium">Medium</button>
    <button data-level="hard">Hard</button>
  </nav>
  <button id="fit" aria-label="Just right for you" title="Just right for you">★ For me</button>
  </div>

  <div id="sub">
    <div id="pnav" hidden>
      <button id="prev" aria-label="Previous practice puzzle">&lsaquo; Previous</button>
      <button id="next" aria-label="New practice puzzle">New puzzle &rsaquo;</button>
    </div>
    <div id="status"><span id="timer">0:00</span><span id="label"></span><span id="msg"></span></div>
  </div>

  <p id="hinttext" aria-live="polite"></p>

  <div id="board" role="grid" aria-label="Sudoku board"></div>

  <div id="tools">
    <button id="notes" aria-pressed="false">Notes: off</button>
    <button id="erase">Erase</button>
    <button id="undo">Undo</button>
    <button id="hint">Hint</button>
  </div>
  <div id="pad"></div>
  <div id="more">
    <div id="themes" role="group" aria-label="Theme">
      <button data-pick="classic">Classic</button>
      <button data-pick="fall">Fall</button>
      <button data-pick="cartoon">Cartoon</button>
    </div>
    <button id="reset">Erase everything and start over</button>
  </div>
  <p id="error" hidden></p>
  <p id="how"><a href="how.html">How it works (the machine learning)</a></p>
</main>
<script src="confetti.js"></script>
<script src="hint.js"></script>
<script src="engine.js"></script>
<script src="skill.js"></script>
<script src="mistake.js"></script>
<script src="app.js"></script>
</body>
</html>
